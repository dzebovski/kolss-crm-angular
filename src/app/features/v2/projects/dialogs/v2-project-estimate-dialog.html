@let errors = shown();

<app-v2-dialog
  [title]="'v2.projectCard.estimate.edit' | translate"
  [subtitle]="subtitle"
  width="form"
  [hint]="hint()"
  [cancelLabel]="'v2.projectPopup.cancel' | translate"
  [saveLabel]="'v2.projectPopup.saveChanges' | translate"
  [saveDisabled]="saving()"
  [invalid]="invalid()"
  [errorCount]="errorCount()"
  [hasUnsavedInput]="hasUnsavedInput()"
  (save)="save()"
  (invalidAttempt)="touched.set(true)"
>
  @if (error(); as message) {
    <app-v2-project-notice tone="danger">{{ message }}</app-v2-project-notice>
  }

  @for (line of lineKeys; track line) {
    @let field = fields[line];
    <fieldset class="v2-estimate-popup__line">
      <legend>{{ labelKey(line) | translate }}</legend>
      <div class="v2-estimate-popup__money">
        <app-v2-form-field
          [label]="'v2.projectPopup.estimate.amount' | translate"
          [error]="errors[line]?.amount ?? ''"
        >
          <input type="text" inputmode="decimal" [formField]="field.amount" />
        </app-v2-form-field>
        <app-v2-form-field [label]="'v2.projectPopup.currency' | translate">
          <app-v2-select
            [ariaLabel]="'v2.projectPopup.currency' | translate"
            [options]="currencies"
            [formField]="field.currency"
          />
        </app-v2-form-field>
      </div>
      <app-v2-form-field
        [label]="'v2.projectCard.row.note' | translate"
        [error]="errors[line]?.note ?? ''"
      >
        <input type="text" [formField]="field.note" />
      </app-v2-form-field>
    </fieldset>
  }

  <p class="v2-estimate-popup__total">
    <span>{{ 'v2.projectCard.estimate.total' | translate }}</span>
    <strong>{{ total() || '—' }}</strong>
  </p>
</app-v2-dialog>
