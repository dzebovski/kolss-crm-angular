@let errors = shown();
<app-v2-dialog
  [title]="title() | translate"
  [subtitle]="subtitle"
  width="form"
  [hint]="hint()"
  [cancelLabel]="'v2.projectPopup.cancel' | translate"
  [saveLabel]="(editing ? 'v2.projectPopup.saveChanges' : title()) | translate"
  [saveDisabled]="saving()"
  [invalid]="invalid()"
  [errorCount]="errorCount()"
  [hasUnsavedInput]="hasUnsavedInput()"
  (save)="save()"
  (invalidAttempt)="touched.set(true)"
>
  @if (error(); as message) {
    <app-v2-project-notice tone="danger">{{ message }}</app-v2-project-notice>
  }
  @if (creditNote(); as note) {
    <app-v2-project-notice>{{ note }}</app-v2-project-notice>
  }
  <div class="v2-contract-popup__row">
    <app-v2-form-field
      [label]="'v2.projectPopup.contract.number' | translate"
      [required]="true"
      [hint]="'v2.projectPopup.contract.numberHint' | translate"
      [error]="errors.number ?? ''"
    >
      <input type="text" [formField]="fields.number" />
    </app-v2-form-field>
    <app-v2-form-field
      [label]="'v2.projectPopup.contract.signedOn' | translate"
      [required]="true"
      [error]="errors.signedOn ?? ''"
    >
      <input type="date" [formField]="fields.signedOn" />
    </app-v2-form-field>
  </div>
  <div class="v2-contract-popup__row">
    <app-v2-form-field
      [label]="'v2.projectPopup.contract.total' | translate"
      [required]="true"
      [hint]="'v2.projectPopup.contract.totalHint' | translate"
      [error]="errors.total ?? ''"
    >
      <input type="text" inputmode="decimal" [formField]="fields.total" />
    </app-v2-form-field>
    <app-v2-form-field
      [label]="'v2.projectPopup.currency' | translate"
      [hint]="currencyLocked ? ('v2.projectPopup.contract.currencyLocked' | translate) : ''"
    >
      <app-v2-select
        [ariaLabel]="'v2.projectPopup.currency' | translate"
        [options]="currencies"
        [formField]="fields.currency"
      />
    </app-v2-form-field>
  </div>
  <app-v2-field-group [label]="'v2.projectPopup.contract.file' | translate">
    <app-v2-project-file-field
      [current]="data.contract?.file?.fileName ?? null"
      [disabled]="saving()"
      [(file)]="file"
    />
  </app-v2-field-group>
</app-v2-dialog>
