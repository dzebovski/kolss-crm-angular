@let errors = shown();

<app-v2-dialog
  [title]="(editing ? 'v2.projectPopup.payment.edit' : 'v2.projectCard.payment.add') | translate"
  [subtitle]="subtitle"
  width="form"
  [hint]="'v2.projectPopup.timelineHint' | translate"
  [cancelLabel]="'v2.projectPopup.cancel' | translate"
  [saveLabel]="(editing ? 'v2.projectPopup.saveChanges' : 'v2.projectCard.payment.add') | translate"
  [saveDisabled]="saving()"
  [invalid]="invalid()"
  [errorCount]="errorCount()"
  [hasUnsavedInput]="hasUnsavedInput()"
  (save)="save()"
  (invalidAttempt)="touched.set(true)"
>
  @if (error(); as message) {
    <app-v2-project-notice tone="danger">{{ message }}</app-v2-project-notice>
  }

  <div class="v2-payment-popup__money">
    <app-v2-form-field
      [label]="'v2.projectPopup.payment.amount' | translate"
      [required]="true"
      [error]="errors.amount ?? ''"
    >
      <input type="text" inputmode="decimal" [formField]="fields.amount" />
    </app-v2-form-field>
    <app-v2-form-field [label]="'v2.projectPopup.currency' | translate">
      <app-v2-select
        [ariaLabel]="'v2.projectPopup.currency' | translate"
        [options]="currencies"
        [formField]="fields.currency"
      />
    </app-v2-form-field>
  </div>

  <app-v2-form-field
    [label]="'v2.projectCard.payment.date' | translate"
    [required]="true"
    [error]="errors.paidOn ?? ''"
  >
    <input type="date" [formField]="fields.paidOn" />
  </app-v2-form-field>

  <app-v2-field-group
    [label]="'v2.projectPopup.payment.basis' | translate"
    [required]="true"
    [error]="errors.basis ?? ''"
  >
    <app-v2-chip-select
      [ariaLabel]="'v2.projectPopup.payment.basis' | translate"
      [options]="bases"
      [formField]="fields.basis"
    />
  </app-v2-field-group>

  <app-v2-form-field [label]="'v2.projectCard.row.note' | translate" [error]="errors.note ?? ''">
    <input type="text" [formField]="fields.note" />
  </app-v2-form-field>

  <app-v2-field-group [label]="'v2.projectCard.payment.receipt' | translate">
    <app-v2-project-file-field
      [current]="data.payment?.file?.fileName ?? null"
      [disabled]="saving()"
      [(file)]="file"
    />
  </app-v2-field-group>
</app-v2-dialog>
